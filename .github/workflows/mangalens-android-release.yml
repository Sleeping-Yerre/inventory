name: Build and release Android APK
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (for example 0.1.1)
        required: true
      version_code:
        description: Increasing integer version code (for example 2)
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mangalens-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" 'platforms;android-37.0' 'build-tools;37.0.0'
          if ($LASTEXITCODE) { throw 'SDK installation failed' }
      - name: Restore private signing material
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if (!$env:KEYSTORE_BASE64 -or !$env:KEYSTORE_PASSWORD) { throw 'Configure signing secrets before releasing' }
          New-Item -ItemType Directory -Force .signing | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $PWD '.signing/mangalens-release.jks'), [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          ConvertTo-SecureString $env:KEYSTORE_PASSWORD -AsPlainText -Force | ConvertFrom-SecureString | Set-Content .signing/password.dpapi
      - name: Build and verify APK
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CODE: ${{ inputs.version_code }}
        run: |
          ./build.ps1 -SdkRoot $env:ANDROID_HOME -JavaRoot $env:JAVA_HOME -VersionName $env:RELEASE_VERSION -VersionCode ([int]$env:RELEASE_CODE)
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CODE: ${{ inputs.version_code }}
        run: |
          New-Item -ItemType Directory -Force ../downloads, ../updates | Out-Null
          Copy-Item dist/MangaLens-Android.apk ../downloads/MangaLens-Android.apk -Force
          Copy-Item dist/MangaLens-Android.apk.sha256 ../downloads/MangaLens-Android.apk.sha256 -Force
          $hash=(Get-FileHash dist/MangaLens-Android.apk -Algorithm SHA256).Hash.ToLowerInvariant()
          $info=@{versionName=$env:RELEASE_VERSION;versionCode=[int]$env:RELEASE_CODE;sha256=$hash;apkUrl="https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/main/downloads/MangaLens-Android.apk"}
          $info | ConvertTo-Json | Set-Content ../updates/android.json -Encoding utf8NoBOM
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ../downloads ../updates
          git commit -m "Release MangaLens Android $env:RELEASE_VERSION"
          git push origin HEAD:main
          gh release create "android-v$env:RELEASE_VERSION" dist/MangaLens-Android.apk dist/MangaLens-Android.apk.sha256 --title "MangaLens Android $env:RELEASE_VERSION" --generate-notes
